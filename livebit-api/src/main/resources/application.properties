spring.application.name=livebit-api

# Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.migrate-at-start=true
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SPRING_API_PORT}

# Security
spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
api.security.jwt.issuer=${JWT_ISSUER}
api.security.jwt.expiration-time=${JWT_EXPIRATION_TIME_SECONDS:7200}
api.security.jwt.cookie-name=${JWT_COOKIE_NAME:accessToken}

logging.level.org.springframework.security=DEBUG