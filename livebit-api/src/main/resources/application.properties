spring.application.name=livebit-api

# Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.redis.cache-null-values=false

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.migrate-at-start=true
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SPRING_API_PORT}

# Security
spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
api.security.jwt.issuer=${JWT_ISSUER}
api.security.jwt.expiration-time=${JWT_EXPIRATION_TIME_SECONDS:7200}
api.security.jwt.cookie-name=${JWT_COOKIE_NAME:accessToken}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_EXTERNAL_URL}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
api.spring.kafka.bid.topic=${KAFKA_BID_TOPIC}

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.uallace.livebit.bid.dto.BidPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
