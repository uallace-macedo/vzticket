services:
  livebit-db:
    image: postgres:alpine
    container_name: livebit-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - livebit-public-network
      - livebit-private-network

  livebit-cache:
    image: redis:alpine
    container_name: livebit-cache
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - livebit-public-network
      - livebit-private-network

  livebit-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.3
    container_name: livebit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - livebit-private-network

  livebit-kafka:
    image: confluentinc/cp-kafka:7.4.3
    container_name: livebit-kafka
    depends_on:
      - livebit-zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: livebit-zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://${KAFKA_EXTERNAL_URL},INTERNAL://${KAFKA_INTERNAL_URL}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - livebit-private-network

networks:
  livebit-public-network:
    driver: bridge
  livebit-private-network:
    driver: bridge
